      // --- HELPERS TEMPS & DATES (ZÉRO MENTION HIER / AUJOURD'HUI) ---
      function secondsToHHMMSS(s) {
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = s % 60;
        const pad = n => n.toString().padStart(2, '0');
        return `${pad(h)}:${pad(m)}:${pad(sec)}`;
      }

      function secondsToHM(s) {
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        if (h === 0 && m === 0) return '0 min';
        if (h === 0) return `${m} min`;
        if (m === 0) return `${h}h`;
        return `${h}h ${m.toString().padStart(2, '0')}m`;
      }

      function secondsToDecimal(s) {
        return (Math.round((s / 3600) * 100) / 100).toFixed(2);
      }

      function calcIntervalSec(start, end) {
        if (!start || !end) return 0;
        const [sh, sm] = start.split(':').map(Number);
        let [eh, em] = end.split(':').map(Number);
        let startMin = sh * 60 + sm;
        let endMin = eh * 60 + em;
        if (endMin < startMin) endMin += 24 * 60; // Nuit / lendemain
        return Math.max(0, (endMin - startMin) * 60);
      }

      // Date toujours explicite et précise, sans termes relatifs
      function formatDayLabel(dateStr) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const date = new Date(y, m - 1, d);
        const wd = date.toLocaleDateString('fr-FR', { weekday: 'long' });
        const day = d.toString().padStart(2, '0');
        const mo = date.toLocaleDateString('fr-FR', { month: 'short' }).replace('.', '');
        const capWd = wd.charAt(0).toUpperCase() + wd.slice(1);
        return `${capWd} ${day} ${mo} (${day}/${m.toString().padStart(2, '0')}/${y})`;
      }

      function formatFullDate(dateStr) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const date = new Date(y, m - 1, d);
        const res = date.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        return res.charAt(0).toUpperCase() + res.slice(1);
      }

      function getWeekNumber(dateStr) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const target = new Date(y, m - 1, d);
        const dayNr = (target.getDay() + 6) % 7;
        target.setDate(target.getDate() - dayNr + 3);
        const firstThursday = target.valueOf();
        target.setMonth(0, 1);
        if (target.getDay() !== 4) {
          target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
        }
        return 1 + Math.ceil((firstThursday - target.valueOf()) / 604800000);
      }

        Upload: ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
        Download: ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
        Car: ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C2.1 10.9 2 11.2 2 11.5V16c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>,
        Utensils: ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 2v6a3 3 0 0 1-3 3 3 3 0 0 1-3-3V2"/><path d="M15 2v14a2 2 0 0 1-2 2h-2"/><path d="M6 2v20"/><path d="M6 7h4"/></svg>,
        Database: ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></svg>
      };

      // --- APPLICATION PRINCIPALE ---
      function App() {
        const [activeTab, setActiveTab] = useState('timesheet'); // 'timesheet' | 'expenses'

        // 1. Données de temps avec persistance garantie
        const [entries, setEntries] = useState(() => loadStoredEntries());

        // Synchronisation automatique et synchrone
        useEffect(() => {
          saveEntriesToStorage(entries);
        }, [entries]);

        // 2. Données de dépenses (Per-diem & VTC)
        const [expenses, setExpenses] = useState(() => loadStoredExpenses());
        useEffect(() => {
          saveExpensesToStorage(expenses);
        }, [expenses]);

        // Filtres
        const [selectedCity, setSelectedCity] = useState('all');
        const [selectedWeek, setSelectedWeek] = useState('all');
        const [search, setSearch] = useState('');
        const [modalOpen, setModalOpen] = useState(false);
        const [expenseModalOpen, setExpenseModalOpen] = useState(false);
        const [backupModalOpen, setBackupModalOpen] = useState(false);
        const [pdfModalOpen, setPdfModalOpen] = useState(false);
        const [editEntry, setEditEntry] = useState(null);
        const [editExpense, setEditExpense] = useState(null);
        const [toast, setToast] = useState(null);

        // Date et Ville synchronisées automatiquement
        const [formDate, setFormDate] = useState('2026-10-22');
        const [formCity, setFormCity] = useState('Metz');
        const [expenseDate, setExpenseDate] = useState('2026-10-22');
        const [expenseCity, setExpenseCity] = useState('Metz');

        const latestEntryDate = useMemo(() => {
          if (!entries || entries.length === 0) return '2026-10-22';
          return [...entries].sort((a,b) => b.date.localeCompare(a.date))[0].date;
        }, [entries]);

        const openAddModal = (datePref) => {
          const targetDate = datePref || '2026-10-22';
          const info = getTourCity(targetDate);
          setEditEntry(null);
          setFormDate(targetDate);
          setFormCity(info ? info.city : 'Metz');
          setModalOpen(true);
        };

        const openEditModal = (entry) => {
          setEditEntry(entry);
          setFormDate(entry.date);
          setFormCity(entry.city || getTourCity(entry.date)?.city || 'Metz');
          setModalOpen(true);
        };

        const handleModalDateChange = (newDate) => {
          setFormDate(newDate);
          const info = getTourCity(newDate);
          if (info && info.city) {
            setFormCity(info.city);
          }
        };

        const openAddExpenseModal = () => {
          setEditExpense(null);
          setExpenseDate('2026-10-22');
          setExpenseCity(getTourCity('2026-10-22')?.city || 'Metz');
          setExpenseModalOpen(true);
        };

        const openEditExpenseModal = (exp) => {
          setEditExpense(exp);
          setExpenseDate(exp.date);
          setExpenseCity(exp.city || getTourCity(exp.date)?.city || 'Metz');
          setExpenseModalOpen(true);
        };

        const handleExpenseDateChange = (newDate) => {
          setExpenseDate(newDate);
          const info = getTourCity(newDate);
          if (info && info.city) {
            setExpenseCity(info.city);
          }
        };

        // Chronomètre live
        const [timerRunning, setTimerRunning] = useState(false);
        const [timerTitle, setTimerTitle] = useState('');
        const [timerSeconds, setTimerSeconds] = useState(0);

        useEffect(() => {
          let interval;
          if (timerRunning) {
            interval = setInterval(() => setTimerSeconds(s => s + 1), 1000);
          }
          return () => clearInterval(interval);
        }, [timerRunning]);

        const showToast = msg => {
          setToast(msg);
          setTimeout(() => setToast(null), 3500);
        };

        // Calculs totaux temps
        const totalSec = useMemo(() => entries.reduce((a, b) => a + b.durationSeconds, 0), [entries]);
        const activeDaysCount = useMemo(() => new Set(entries.map(e => e.date)).size, [entries]);

        // Semaines dynamiques présentes dans les données
        const availableWeeks = useMemo(() => {
          const weeksMap = new Map();
          entries.forEach(e => {
            const wNum = getWeekNumber(e.date);
            const key = `S${wNum}`;
            if (!weeksMap.has(key)) {
              weeksMap.set(key, { key, label: `Sem. ${wNum}`, totalSec: 0, count: 0 });
            }
            const item = weeksMap.get(key);
            item.totalSec += e.durationSeconds;
            item.count += 1;
          });
          return Array.from(weeksMap.values()).sort((a, b) => b.key.localeCompare(a.key));
        }, [entries]);

        // Groupement par jour
        const dayGroups = useMemo(() => {
          const map = {};
          entries.forEach(e => {
            if (!map[e.date]) map[e.date] = [];
            map[e.date].push(e);
          });
          return Object.keys(map).sort((a, b) => b.localeCompare(a)).map(date => {
            const list = map[date];
            const sec = list.reduce((a, b) => a + b.durationSeconds, 0);
            const tourInfo = getTourCity(date);
            return {
              date,
              formattedDate: formatDayLabel(date),
              city: tourInfo?.city || list[0]?.city || 'Étape Tournée',
              isShowDay: tourInfo?.isShowDay,
              totalSeconds: sec,
              entries: list.sort((a, b) => b.startTime.localeCompare(a.startTime))
            };
          });
        }, [entries]);

        // Filtrage des jours
        const filteredDays = useMemo(() => {
          return dayGroups.filter(d => {
            if (selectedCity !== 'all' && d.city !== selectedCity) return false;
            if (selectedWeek !== 'all') {
              const dWeek = `S${getWeekNumber(d.date)}`;
              if (dWeek !== selectedWeek) return false;
            }
            if (search.trim()) {
              const q = search.toLowerCase();
              const hasMatch = d.entries.some(e => e.title.toLowerCase().includes(q) || (e.city || '').toLowerCase().includes(q));
              if (!hasMatch) return false;
            }
            return true;
          });
        }, [dayGroups, selectedCity, selectedWeek, search]);

        // Actions Créneaux Temps avec sauvegarde synchrone
        const handleSave = entryData => {
          let nextEntries;
          if (editEntry) {
            nextEntries = entries.map(e => e.id === editEntry.id ? { ...e, ...entryData } : e);
            showToast(`Créneau modifié pour le ${entryData.date} (${secondsToHM(entryData.durationSeconds)})`);
          } else {
            const newId = 'e-' + Date.now();
            nextEntries = [{ ...entryData, id: newId }, ...entries];
            showToast(`Nouveau créneau ajouté pour le ${entryData.date} (${secondsToHM(entryData.durationSeconds)})`);
          }
          setEntries(nextEntries);
          saveEntriesToStorage(nextEntries); // Écriture synchrone immédiate

          // Réinitialiser les filtres pour afficher immédiatement le créneau ajouté
          setSelectedCity('all');
          setSelectedWeek('all');
          setSearch('');
          setModalOpen(false);
          setEditEntry(null);
        };

        const handleDelete = id => {
          if (confirm('Supprimer ce créneau ?')) {
            const nextEntries = entries.filter(e => e.id !== id);
            setEntries(nextEntries);
            saveEntriesToStorage(nextEntries);
            showToast('Créneau supprimé');
          }
        };

        const handleDuplicate = id => {
          const item = entries.find(e => e.id === id);
          if (item) {
            const newId = 'e-' + Date.now();
            const copy = { ...item, id: newId, title: item.title + ' (copie)' };
            const nextEntries = [copy, ...entries];
            setEntries(nextEntries);
            saveEntriesToStorage(nextEntries);
            showToast(`Créneau dupliqué sur le ${item.date}`);
          }
        };

        // Actions Dépenses (Per-diem & VTC)
        const handleSaveExpense = expenseData => {
          let next;
          if (editExpense) {
            next = expenses.map(x => x.id === editExpense.id ? { ...x, ...expenseData } : x);
            showToast('Dépense mise à jour !');
          } else {
            const newId = 'exp-' + Date.now();
            next = [{ ...expenseData, id: newId }, ...expenses];
            showToast('Justificatif / Dépense enregistré !');
          }
          setExpenses(next);
          saveExpensesToStorage(next);
          setExpenseModalOpen(false);
          setEditExpense(null);
        };

        const handleDeleteExpense = id => {
          if (confirm('Supprimer cette dépense ?')) {
            const next = expenses.filter(x => x.id !== id);
            setExpenses(next);
            saveExpensesToStorage(next);
            showToast('Dépense supprimée');
          }
        };

        // Export/Import JSON de secours
        const handleExportJSON = () => {
          const backupData = {
            exportDate: new Date().toISOString(),
            entries,
            expenses
          };
          const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `legend-tour-sauvegarde-${new Date().toISOString().split('T')[0]}.json`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('Sauvegarde JSON téléchargée !');
        };

        const handleImportJSON = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const data = JSON.parse(event.target.result);
              if (Array.isArray(data.entries)) {
                setEntries(data.entries);
                saveEntriesToStorage(data.entries);
              }
              if (Array.isArray(data.expenses)) {
                setExpenses(data.expenses);
                saveExpensesToStorage(data.expenses);
              }
              showToast('Données importées avec succès !');
              setBackupModalOpen(false);
            } catch (err) {
              alert('Fichier JSON invalide');
            }
          };
          reader.readAsText(file);
        };

        // Export PDF complet des heures
        const handleGeneratePdf = (period) => {
          let list = entries;
          let label = 'Tournée Complète';
          if (period === 'S43') {
            list = entries.filter(e => e.date >= '2026-10-19' && e.date <= '2026-10-25');
            label = 'Semaine 43 (19 au 25 oct. 2026 : Strasbourg, Metz, Bruxelles)';
          } else if (period === 'S44') {
            list = entries.filter(e => e.date >= '2026-10-26' && e.date <= '2026-11-01');
            label = 'Semaine 44 (26 oct. au 01 nov. 2026 : Nice, Aix, Lyon)';
          } else if (period === 'S46') {
            list = entries.filter(e => e.date >= '2026-11-09' && e.date <= '2026-11-15');
            label = 'Semaine 46 (09 au 15 nov. 2026 : Paris)';
          } else if (period === 'S42') {
            list = entries.filter(e => e.date >= '2026-10-12' && e.date <= '2026-10-18');
            label = 'Semaine 42 (12 au 18 oct. 2026 : Rouen, Dijon, Chambéry, Montpellier)';
          } else if (period === 'S41') {
            list = entries.filter(e => e.date >= '2026-10-05' && e.date <= '2026-10-11');
            label = 'Semaine 41 (05 au 11 oct. 2026 : Bordeaux, Nantes, Rennes, Liévin)';
          } else if (period === '22-10') {
            list = entries.filter(e => e.date === '2026-10-22');
            label = 'Journée du 22/10/2026 (Metz)';
          } else if (period === '17-10') {
            list = entries.filter(e => e.date === '2026-10-17');
            label = 'Journée du 17/10/2026 (Montpellier)';
          }

          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
          const sumSec = list.reduce((a, b) => a + b.durationSeconds, 0);

          const latestDate = entries.length > 0 ? [...entries].sort((a,b) => b.date.localeCompare(a.date))[0].date : '2026-10-22';

          // En-tête
          doc.setFillColor(15, 23, 42);
          doc.rect(0, 0, 210, 36, 'F');
          doc.setFillColor(234, 88, 12);
          doc.rect(0, 36, 210, 2.5, 'F');

          doc.setTextColor(255, 255, 255);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(16);
          doc.text('LEGEND TOUR', 14, 14);

          doc.setFontSize(10);
          doc.setFont('helvetica', 'normal');
          doc.setTextColor(226, 232, 240);
          doc.text('RÉCAPITULATIF DES HEURES TRAVAILLÉES PAR VILLE & DATE', 14, 21);

          doc.setFontSize(8.5);
          doc.setTextColor(251, 146, 60);
          doc.text(`Total cumulé arrêté au ${formatFullDate(latestDate)}`, 14, 28);

          doc.setTextColor(203, 213, 225);
          doc.text(`Période : ${label}`, 196, 14, { align: 'right' });
          doc.text(`Arrêté au : ${latestDate.split('-').reverse().join('/')}`, 196, 20, { align: 'right' });
          doc.text(`Projet : LEGEND TOUR`, 196, 26, { align: 'right' });

          // Cartouches KPI
          doc.setFillColor(248, 250, 252);
          doc.setDrawColor(226, 232, 240);
          doc.roundedRect(14, 44, 56, 22, 2, 2, 'FD');
          doc.setFontSize(8);
          doc.setTextColor(100, 116, 139);
          doc.text('TOTAL HEURES', 18, 51);
          doc.setFontSize(14);
          doc.setTextColor(15, 23, 42);
          doc.text(secondsToHM(sumSec), 18, 60);

          doc.roundedRect(74, 44, 56, 22, 2, 2, 'FD');
          doc.setFontSize(8);
          doc.setTextColor(100, 116, 139);
          doc.text('JOURS TRAVAILLÉS', 78, 51);
          doc.setFontSize(14);
          doc.setTextColor(15, 23, 42);
          doc.text(`${new Set(list.map(e => e.date)).size} jours`, 78, 60);

          doc.roundedRect(134, 44, 62, 22, 2, 2, 'FD');
          doc.setFontSize(8);
          doc.setTextColor(100, 116, 139);
          doc.text('TOTAL DÉCIMAL', 138, 51);
          doc.setFontSize(14);
          doc.setTextColor(15, 23, 42);
          doc.text(`${secondsToDecimal(sumSec)} h`, 138, 60);

          // Bandeau villes
          doc.setFillColor(255, 247, 237);
          doc.setDrawColor(254, 215, 170);
          doc.roundedRect(14, 71, 182, 10, 2, 2, 'FD');
          doc.setFontSize(7.5);
          doc.setTextColor(194, 65, 12);
          doc.text('VILLES ÉTAPES :', 18, 77.5);
          doc.setFont('helvetica', 'normal');
          doc.setTextColor(67, 20, 7);
          doc.text('Bordeaux (07/10) • Nantes (08/10) • Rennes (09/10) • Liévin (11/10) • Rouen (12/10) • Dijon (15/10) • Chambéry (16/10) • Montpellier (17/10) • Strasbourg (21/10) • Metz (22/10) • Bruxelles (23-24/10) • Nice (27/10) • Aix (28/10) • Lyon (29/10) • Paris (14-15/11)', 48, 77.5);

          // Tableau
          const rows = [...list].sort((a,b) => a.date.localeCompare(b.date) || a.startTime.localeCompare(b.startTime)).map(e => [
            `${formatFullDate(e.date)}\n[${e.city || 'Tournée'}]`,
            `${e.startTime} - ${e.endTime}`,
            secondsToHHMMSS(e.durationSeconds),
            e.title,
            e.category || 'Général'
          ]);

          doc.autoTable({
            startY: 86,
            head: [['Date & Ville', 'Horaires', 'Durée', 'Description de la tâche', 'Catégorie']],
            body: rows,
            theme: 'striped',
            headStyles: { fillColor: [15, 23, 42], textColor: [255, 255, 255], fontSize: 8 },
            styles: { fontSize: 7.5, cellPadding: 2.2, textColor: [30, 41, 59] },
            columnStyles: {
              0: { cellWidth: 44, fontStyle: 'bold' },
              1: { cellWidth: 24, halign: 'center' },
              2: { cellWidth: 22, halign: 'right', fontStyle: 'bold' },
              3: { cellWidth: 62 },
              4: { cellWidth: 30 }
            },
            margin: { left: 14, right: 14 }
          });

          doc.save(`recapitulatif-legend-tour-${period}.pdf`);
          setPdfModalOpen(false);
          showToast('PDF téléchargé avec succès !');
        };

        // Export PDF Note de Frais (Per-diem & VTC)
        const handleGenerateExpensesPdf = () => {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
          const totalAmount = expenses.reduce((sum, x) => sum + (Number(x.amount) || 0), 0);
          const totalVtc = expenses.filter(x => x.type === 'Transport VTC').reduce((sum, x) => sum + (Number(x.amount) || 0), 0);
          const totalPerDiem = expenses.filter(x => x.type.includes('Per-diem')).reduce((sum, x) => sum + (Number(x.amount) || 0), 0);

          // En-tête
          doc.setFillColor(15, 23, 42);
          doc.rect(0, 0, 210, 36, 'F');
          doc.setFillColor(234, 88, 12);
          doc.rect(0, 36, 210, 2.5, 'F');

          doc.setTextColor(255, 255, 255);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(16);
          doc.text('LEGEND TOUR - NOTE DE FRAIS & JUSTIFICATIFS', 14, 14);

          doc.setFontSize(10);
          doc.setFont('helvetica', 'normal');
          doc.setTextColor(226, 232, 240);
          doc.text('REMBOURSEMENT PER-DIEM ET TRANSPORTS VTC', 14, 21);

          doc.setFontSize(8.5);
          doc.setTextColor(251, 146, 60);
          doc.text('Document justificatif certifié pour remboursement de frais', 14, 28);

          doc.setTextColor(203, 213, 225);
          doc.text(`Édité le : ${new Date().toLocaleDateString('fr-FR')}`, 196, 14, { align: 'right' });
          doc.text(`Projet : LEGEND TOUR`, 196, 20, { align: 'right' });
          doc.text(`Nb lignes : ${expenses.length}`, 196, 26, { align: 'right' });

          // KPI Cards
          doc.setFillColor(248, 250, 252);
          doc.setDrawColor(226, 232, 240);
          doc.roundedRect(14, 44, 56, 22, 2, 2, 'FD');
          doc.setFontSize(8);
          doc.setTextColor(100, 116, 139);
          doc.text('TOTAL REMBOURSEMENT', 18, 51);
          doc.setFontSize(14);
          doc.setTextColor(234, 88, 12);
          doc.text(`${totalAmount.toFixed(2)} €`, 18, 60);

          doc.roundedRect(74, 44, 56, 22, 2, 2, 'FD');
          doc.setFontSize(8);
          doc.setTextColor(100, 116, 139);
          doc.text('DONT TRANSPORTS VTC', 78, 51);
          doc.setFontSize(14);
          doc.setTextColor(15, 23, 42);
          doc.text(`${totalVtc.toFixed(2)} €`, 78, 60);

          doc.roundedRect(134, 44, 62, 22, 2, 2, 'FD');
          doc.setFontSize(8);
          doc.setTextColor(100, 116, 139);
          doc.text('DONT PER-DIEM / REPAS', 138, 51);
          doc.setFontSize(14);
          doc.setTextColor(15, 23, 42);
          doc.text(`${totalPerDiem.toFixed(2)} €`, 138, 60);

          // Table
          const rows = expenses.map(x => [
            x.date,
            x.city || 'Tournée',
            x.type,
            x.description,
            x.receiptName ? 'Reçu joint' : 'Déclaration forfait',
            `${Number(x.amount).toFixed(2)} €`
          ]);

          doc.autoTable({
            startY: 72,
            head: [['Date', 'Ville', 'Type de frais', 'Description / Trajet', 'Justificatif', 'Montant']],
            body: rows,

                      <Icons.FileDown className="w-5 h-5 text-orange-600" />
                    </button>

                    <button onClick={() => handleGeneratePdf('S41')} className="w-full p-3 text-left rounded-2xl border border-slate-200 hover:border-orange-500 hover:bg-orange-50/30 flex justify-between items-center">
                      <div>
                        <span className="font-bold text-slate-900 block text-sm">Semaine 41 (05 au 11 oct. 2026)</span>
                        <span className="text-xs text-slate-500">Bordeaux, Nantes, Rennes, Liévin</span>
                      </div>
                      <Icons.FileDown className="w-5 h-5 text-orange-600" />
                    </button>

                    <button onClick={() => handleGeneratePdf('22-10')} className="w-full p-3 text-left rounded-2xl border border-slate-200 hover:border-orange-500 hover:bg-orange-50/30 flex justify-between items-center">
                      <div>
                        <span className="font-bold text-slate-900 block text-sm">Journée du 22/10/2026</span>
                        <span className="text-xs text-slate-500">Metz</span>
                      </div>
                      <Icons.FileDown className="w-5 h-5 text-orange-600" />
                    </button>

                    <button onClick={() => handleGeneratePdf('17-10')} className="w-full p-3 text-left rounded-2xl border border-slate-200 hover:border-orange-500 hover:bg-orange-50/30 flex justify-between items-center">
                      <div>
                        <span className="font-bold text-slate-900 block text-sm">Journée du 17/10/2026</span>
                        <span className="text-xs text-slate-500">Montpellier</span>
                      </div>
                      <Icons.FileDown className="w-5 h-5 text-orange-600" />
                    </button>
                  </div>
                  <button onClick={() => setPdfModalOpen(false)} className="w-full py-2.5 text-sm font-semibold text-slate-600 bg-slate-100 rounded-xl">Fermer</button>
                </div>
              </div>
            )}

            {/* Modal Sauvegarde / Export JSON */}
            {backupModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-xs">
                <div className="w-full max-w-md bg-white rounded-3xl p-6 shadow-2xl">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                    <div className="flex items-center gap-2">
                      <Icons.Database className="w-5 h-5 text-emerald-500" />
                      <h3 className="text-base font-bold text-slate-900">Sauvegarde & Sécurité des données</h3>
                    </div>
                    <button onClick={() => setBackupModalOpen(false)} className="p-2 text-slate-400"><Icons.X className="w-5 h-5" /></button>
                  </div>
                  <div className="py-4 space-y-4">
                    <p className="text-xs text-slate-600 leading-relaxed">
                      Vos heures ({entries.length} créneaux) et vos frais ({expenses.length} justificatifs) sont stockés dans votre navigateur.
                      Pour une sécurité totale et transférer vos données sur un autre appareil, vous pouvez exporter ou importer un fichier JSON.
                    </p>

                    <button
                      onClick={handleExportJSON}
                      className="w-full p-3 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300 rounded-2xl font-bold text-xs flex items-center justify-center gap-2"
                    >
                      <Icons.Download className="w-4 h-4 text-emerald-600" />
                      <span>Télécharger ma sauvegarde (Export JSON)</span>
                    </button>

                    <div className="border-t border-slate-100 pt-3">
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Restaurer depuis un fichier JSON :</label>
                      <input
                        type="file"
                        accept=".json"
                        onChange={handleImportJSON}
                        className="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200"
                      />
                    </div>

                    <div className="border-t border-slate-100 pt-3">
                      <button
                        onClick={() => {
                          if (confirm('Voulez-vous réinitialiser avec les données originales du Legend Tour ?')) {
                            setEntries(INITIAL_ENTRIES);
                            saveEntriesToStorage(INITIAL_ENTRIES);
                            showToast('Données originales réinitialisées');
                            setBackupModalOpen(false);
                          }
                        }}
                        className="text-xs text-rose-600 hover:underline"
                      >
                        Réinitialiser avec les données par défaut de la tournée
                      </button>
                    </div>
                  </div>
                  <button onClick={() => setBackupModalOpen(false)} className="w-full py-2.5 text-sm font-semibold text-slate-600 bg-slate-100 rounded-xl">Fermer</button>
                </div>
              </div>
            )}

            {/* Notification Toast */}
            {toast && (
              <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2">
                <Icons.Check className="w-4 h-4 text-emerald-400" />
                <span>{toast}</span>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
