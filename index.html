      // --- HELPERS TEMPS & DATES ---
      function secondsToHHMMSS(s) {
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = s % 60;
        const pad = n => n.toString().padStart(2, '0');
        return `${pad(h)}:${pad(m)}:${pad(sec)}`;
      }

      function secondsToHM(s) {
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        if (h === 0 && m === 0) return '0 min';
        if (h === 0) return `${m} min`;
        if (m === 0) return `${h}h`;
        return `${h}h ${m.toString().padStart(2, '0')}m`;
      }

      function secondsToDecimal(s) {
        return (Math.round((s / 3600) * 100) / 100).toFixed(2);
      }

      function calcIntervalSec(start, end) {
        if (!start || !end) return 0;
        const [sh, sm] = start.split(':').map(Number);
        let [eh, em] = end.split(':').map(Number);
        let startMin = sh * 60 + sm;
        let endMin = eh * 60 + em;
        if (endMin < startMin) endMin += 24 * 60; // Nuit / lendemain
        return Math.max(0, (endMin - startMin) * 60);
      }

      function formatDayLabel(dateStr) {
        if (dateStr === '2026-10-18') return "Aujourd'hui";
        if (dateStr === '2026-10-17') return "Hier";
        const [y, m, d] = dateStr.split('-').map(Number);
        const date = new Date(y, m - 1, d);
        const wd = date.toLocaleDateString('fr-FR', { weekday: 'short' });
        const day = d.toString().padStart(2, '0');
        const mo = date.toLocaleDateString('fr-FR', { month: 'short' }).replace('.', '');
        return `${wd}., ${day} ${mo}.`;
      }

      function formatFullDate(dateStr) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const date = new Date(y, m - 1, d);
        const res = date.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        return res.charAt(0).toUpperCase() + res.slice(1);
      }

        });

        const [pdfModalOpen, setPdfModalOpen] = useState(false);
        const [editEntry, setEditEntry] = useState(null);
        const [toast, setToast] = useState(null);

        // Chronomètre live
        const [timerRunning, setTimerRunning] = useState(false);
        const [timerTitle, setTimerTitle] = useState('');
        const [timerSeconds, setTimerSeconds] = useState(0);

        useEffect(() => {
          let interval;
          if (timerRunning) {
            interval = setInterval(() => setTimerSeconds(s => s + 1), 1000);
          }
          return () => clearInterval(interval);
        }, [timerRunning]);

        const showToast = msg => {
          setToast(msg);
          setTimeout(() => setToast(null), 3000);
        };

        // Calculs totaux
        const totalSec = useMemo(() => entries.reduce((a, b) => a + b.durationSeconds, 0), [entries]);
        const activeDaysCount = useMemo(() => new Set(entries.map(e => e.date)).size, [entries]);

        // Groupement par jour
        const dayGroups = useMemo(() => {
          const map = {};
          entries.forEach(e => {
            if (!map[e.date]) map[e.date] = [];
            map[e.date].push(e);
          });
          return Object.keys(map).sort((a, b) => b.localeCompare(a)).map(date => {
            const list = map[date];
            const sec = list.reduce((a, b) => a + b.durationSeconds, 0);
            const tourInfo = getTourCity(date);
            return {
              date,
              formattedDate: formatDayLabel(date),
              city: tourInfo?.city || list[0]?.city || 'Étape Tournée',
              isShowDay: tourInfo?.isShowDay,
              totalSeconds: sec,
              entries: list.sort((a, b) => b.startTime.localeCompare(a.startTime))
            };
          });

                    const start = form.start.value;
                    const end = form.end.value;
                    const cat = form.category.value;
                    const sec = calcIntervalSec(start, end);
                    handleSave({ title, date, city, startTime: start, endTime: end, durationSeconds: sec, category: cat, project: 'LEGEND TOUR' });
                  }} className="space-y-4 mt-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Description</label>
                      <input name="title" defaultValue={editEntry ? editEntry.title : ''} required placeholder="ex: Show + M&G" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm" />
                      <div className="flex flex-wrap gap-1.5 mt-2">
                        {['Show + M&G + rangements', 'To do salle chef de projet', 'Copie des rushs', 'Trajet déplacement'].map(s => (
                          <button key={s} type="button" onClick={e => e.target.closest('form').title.value = s} className="text-xs px-2 py-1 bg-slate-100 hover:bg-orange-50 rounded-lg text-slate-600">{s}</button>
                        ))}
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Date</label>
                        <input name="date" type="date" defaultValue={editEntry ? editEntry.date : '2026-10-18'} required className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Ville</label>
                        <input name="city" defaultValue={editEntry ? editEntry.city : 'Montpellier'} required className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-3 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                      <div>
                        <label className="block text-xs text-slate-500 mb-1">Début</label>
                        <input name="start" type="time" defaultValue={editEntry ? editEntry.startTime : '14:00'} required className="w-full p-2 bg-white border border-slate-200 rounded-xl text-sm font-mono" />
                      </div>
                      <div>
                        <label className="block text-xs text-slate-500 mb-1">Fin</label>
                        <input name="end" type="time" defaultValue={editEntry ? editEntry.endTime : '18:00'} required className="w-full p-2 bg-white border border-slate-200 rounded-xl text-sm font-mono" />
                      </div>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Catégorie</label>
                      <select name="category" defaultValue={editEntry ? editEntry.category : 'Chef de projet & Régie'} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                        <option value="Show & M&G">Show & M&G</option>
                        <option value="Chef de projet & Régie">Chef de projet & Régie</option>
                        <option value="Trajet & Déplacement">Trajet & Déplacement</option>
                        <option value="Technique & Rushs">Technique & Rushs</option>
                        <option value="Média & Vidéo">Média & Vidéo</option>
                      </select>
                    </div>
                    <div className="flex gap-3 pt-2">
                      <button type="button" onClick={() => setModalOpen(false)} className="flex-1 py-3 text-sm font-semibold bg-slate-100 rounded-xl">Annuler</button>
                      <button type="submit" className="flex-1 py-3 text-sm font-bold bg-orange-600 text-white rounded-xl shadow-md">Enregistrer</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Modal d'export PDF */}
            {pdfModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-xs">
                <div className="w-full max-w-md bg-white rounded-3xl p-6 shadow-2xl">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                    <h3 className="text-base font-bold text-slate-900">Générer le récapitulatif PDF</h3>
                    <button onClick={() => setPdfModalOpen(false)} className="p-2 text-slate-400"><Icons.X className="w-5 h-5" /></button>
                  </div>
                  <div className="space-y-3 my-4">
                    <button onClick={() => handleGeneratePdf('tout')} className="w-full p-3.5 text-left rounded-2xl border border-orange-500 bg-orange-50/50 hover:bg-orange-100/50 flex justify-between items-center">
                      <div>
                        <span className="font-bold text-slate-900 block text-sm">Tournée complète (123h44)</span>
                        <span className="text-xs text-slate-500">Toutes les dates & 8 villes</span>
                      </div>
                      <Icons.FileDown className="w-5 h-5 text-orange-600" />
                    </button>
                    <button onClick={() => handleGeneratePdf('S42')} className="w-full p-3.5 text-left rounded-2xl border border-slate-200 hover:border-orange-500 hover:bg-orange-50/30 flex justify-between items-center">
                      <div>
                        <span className="font-bold text-slate-900 block text-sm">Semaine 42 (55h54)</span>
                        <span className="text-xs text-slate-500">Rouen, Dijon, Chambéry, Montpellier</span>
                      </div>
                      <Icons.FileDown className="w-5 h-5 text-orange-600" />
                    </button>
                    <button onClick={() => handleGeneratePdf('S41')} className="w-full p-3.5 text-left rounded-2xl border border-slate-200 hover:border-orange-500 hover:bg-orange-50/30 flex justify-between items-center">
                      <div>
                        <span className="font-bold text-slate-900 block text-sm">Semaine 41 (67h50)</span>
                        <span className="text-xs text-slate-500">Bordeaux, Nantes, Rennes, Liévin</span>
                      </div>
                      <Icons.FileDown className="w-5 h-5 text-orange-600" />
                    </button>
                    <button onClick={() => handleGeneratePdf('hier')} className="w-full p-3.5 text-left rounded-2xl border border-slate-200 hover:border-orange-500 hover:bg-orange-50/30 flex justify-between items-center">
                      <div>
                        <span className="font-bold text-slate-900 block text-sm">Hier (17/10 - 14h44)</span>
                        <span className="text-xs text-slate-500">Montpellier</span>
                      </div>
                      <Icons.FileDown className="w-5 h-5 text-orange-600" />
                    </button>
                  </div>
                  <button onClick={() => setPdfModalOpen(false)} className="w-full py-2.5 text-sm font-semibold text-slate-600 bg-slate-100 rounded-xl">Fermer</button>
                </div>
              </div>
            )}

            {/* Notification Toast */}
            {toast && (
              <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2">
                <Icons.Check className="w-4 h-4 text-emerald-400" />
                <span>{toast}</span>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
